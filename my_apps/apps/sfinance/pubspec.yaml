name: sfinance
description: SFinance — personal finance desktop app.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.19.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  shared_models:
    path: ../../packages/shared_models
  shared_ui:
    path: ../../packages/shared_ui
  shared_services:
    path: ../../packages/shared_services
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift: ^2.20.0

flutter:
  uses-material-design: true
